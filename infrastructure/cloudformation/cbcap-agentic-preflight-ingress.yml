AWSTemplateFormatVersion: '2010-09-09'
Description: Short-lived guarded listener rule for CB-CAP production preactivation probes.

Parameters:
  ListenerArn:
    Type: String
    MinLength: 20
  TargetGroupArn:
    Type: String
    MinLength: 20
  DomainName:
    Type: String
    Default: api.cbcap.sozorockfoundation.org
    AllowedPattern: '^[A-Za-z0-9.-]+$'
  PreflightHeaderValue:
    Type: String
    NoEcho: true
    AllowedPattern: '^[0-9a-f]{64}$'
  Enabled:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']

Conditions:
  PreflightEnabled: !Equals [!Ref Enabled, 'true']

Resources:
  PreflightRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: PreflightEnabled
    Properties:
      ListenerArn: !Ref ListenerArn
      Priority: 5
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values: [!Ref DomainName]
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-CB-CAP-Preflight
            Values: [!Ref PreflightHeaderValue]
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /api/health
              - /api/cbcap
              - /api/cbcap/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroupArn

Outputs:
  RuleEnabled:
    Value: !If [PreflightEnabled, 'true', 'false']
