AWSTemplateFormatVersion: '2010-09-09'
Description: Governed private AWS runtime for CB-CAP.

Parameters:
  RuntimeImageUri:
    Type: String
    MinLength: 20
  DomainName:
    Type: String
    Default: api.cbcap.sozorockfoundation.org
    AllowedPattern: '^[A-Za-z0-9.-]+$'
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Default: Z07905293AANZWGYZ84F3
  EvidenceGatewayUrl:
    Type: String
    Default: https://health.sozorockfoundation.org/api/evidence/v1/gateway
    AllowedPattern: '^https://[^?#]+/api/evidence/v1/gateway$'
  DatabaseName:
    Type: String
    Default: cbcap
    AllowedPattern: '^[A-Za-z][A-Za-z0-9_]{0,62}$'
  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.micro
  DatabaseAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 1024
  RuntimeCpu:
    Type: String
    Default: '512'
    AllowedValues: ['256', '512', '1024', '2048']
  RuntimeMemory:
    Type: String
    Default: '1024'
    AllowedValues: ['512', '1024', '2048', '3072', '4096']
  DesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 10
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 60, 90, 120, 150, 180, 365]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: cbcap-private
        - Key: Product
          Value: CB-CAP

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: cbcap-public-a

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: cbcap-public-b

  PublicSubnetARouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  DatabaseSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.10.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: cbcap-db-a

  DatabaseSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.11.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: cbcap-db-b

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Isolated subnets for CB-CAP PostgreSQL.
      SubnetIds:
        - !Ref DatabaseSubnetA
        - !Ref DatabaseSubnetB

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTPS ingress for CB-CAP runtime.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 10.42.0.0/16

  RuntimeSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CB-CAP runtime tasks accept only ALB traffic.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !GetAtt LoadBalancerSecurityGroup.GroupId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 10.42.0.0/16

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL ingress only from the CB-CAP runtime.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !GetAtt RuntimeSecurityGroup.GroupId

  RuntimeDatabasePassword:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Runtime-only password for the CB-CAP PostgreSQL role.
      GenerateSecretString:
        PasswordLength: 40
        ExcludePunctuation: true
        RequireEachIncludedType: true

  CheckpointEncryptionKey:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: 32-byte application encryption key for LangGraph checkpoints.
      GenerateSecretString:
        PasswordLength: 32
        ExcludePunctuation: true
        RequireEachIncludedType: true

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      DBName: !Ref DatabaseName
      MasterUsername: cbcap_admin
      ManageMasterUserPassword: true
      DBInstanceClass: !Ref DatabaseInstanceClass
      AllocatedStorage: !Ref DatabaseAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: false
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups:
        - !GetAtt DatabaseSecurityGroup.GroupId
      BackupRetentionPeriod: 7
      DeleteAutomatedBackups: false
      DeletionProtection: true
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
      EnableCloudwatchLogsExports:
        - postgresql
        - upgrade
      Tags:
        - Key: Product
          Value: CB-CAP
        - Key: DataBoundary
          Value: Private

  PrivateEvidenceKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: KMS key for tenant-private CB-CAP evidence objects.
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: RootAccountControl
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'

  PrivateEvidenceKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/cbcap-private-evidence
      TargetKeyId: !Ref PrivateEvidenceKey

  PrivateEvidenceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt PrivateEvidenceKey.Arn
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - Key: Product
          Value: CB-CAP
        - Key: DataBoundary
          Value: TenantPrivate

  PrivateEvidenceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PrivateEvidenceBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt PrivateEvidenceBucket.Arn
              - !Sub '${PrivateEvidenceBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false
          - Sid: RequireExplicitKmsEncryption
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${PrivateEvidenceBucket.Arn}/*'
            Condition:
              StringNotEquals:
                s3:x-amz-server-side-encryption: aws:kms
          - Sid: RequirePrivateEvidenceKmsKey
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${PrivateEvidenceBucket.Arn}/*'
            Condition:
              StringNotEquals:
                s3:x-amz-server-side-encryption-aws-kms-key-id: !GetAtt PrivateEvidenceKey.Arn

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: cbcap-workspace
      DeletionProtection: ACTIVE
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      MfaConfiguration: ON
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 14
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 3

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: cbcap-workspace-web
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  RuntimeLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /sozorock/cbcap/runtime
      RetentionInDays: !Ref LogRetentionDays

  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: cbcap-private-runtime
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  RuntimeTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadRuntimeSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref RuntimeDatabasePassword
                  - !Ref CheckpointEncryptionKey

  MigrationTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadMigrationSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref RuntimeDatabasePassword
                  - !GetAtt Database.MasterUserSecret.SecretArn

  MembershipAdminTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadMembershipAdminSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !GetAtt Database.MasterUserSecret.SecretArn

  RuntimeTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: TenantPrivateEvidence
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetBucketVersioning
                  - s3:ListBucket
                Resource: !GetAtt PrivateEvidenceBucket.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource: !Sub '${PrivateEvidenceBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:Encrypt
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                Resource: !GetAtt PrivateEvidenceKey.Arn

  RuntimeTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: cbcap-runtime
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref RuntimeCpu
      Memory: !Ref RuntimeMemory
      ExecutionRoleArn: !GetAtt RuntimeTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt RuntimeTaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: runtime
          Image: !Ref RuntimeImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
            - {Name: PORT, Value: '8080'}
            - Name: CB_CAP_DATABASE_HOST
              Value: !GetAtt Database.Endpoint.Address
            - Name: CB_CAP_DATABASE_PORT
              Value: !GetAtt Database.Endpoint.Port
            - Name: CB_CAP_DATABASE_NAME
              Value: !Ref DatabaseName
            - {Name: CB_CAP_DATABASE_USERNAME, Value: cbcap_runtime}
            - Name: CB_CAP_COGNITO_REGION
              Value: !Ref AWS::Region
            - Name: CB_CAP_COGNITO_USER_POOL_ID
              Value: !Ref UserPool
            - Name: CB_CAP_COGNITO_APP_CLIENT_ID
              Value: !Ref UserPoolClient
            - Name: CB_CAP_EVIDENCE_GATEWAY_URL
              Value: !Ref EvidenceGatewayUrl
            - {Name: CB_CAP_ALLOWED_ORIGINS, Value: 'https://cbcap.sozorockfoundation.org'}
            - {Name: CB_CAP_IDENTITY_GRANT_TTL_SECONDS, Value: '900'}
            - {Name: CB_CAP_IDENTITY_MAX_AUTH_AGE_SECONDS, Value: '43200'}
            - {Name: CB_CAP_MAX_EXTERNAL_CALLS, Value: '12'}
            - {Name: CB_CAP_MAX_MODEL_TOKENS, Value: '0'}
            - {Name: CB_CAP_MAX_MODEL_COST_USD, Value: '0'}
            - {Name: CB_CAP_REQUIRE_CHECKPOINT_ENCRYPTION, Value: 'true'}
            - {Name: LANGGRAPH_STRICT_MSGPACK, Value: 'true'}
            - Name: CB_CAP_PRIVATE_EVIDENCE_BUCKET
              Value: !Ref PrivateEvidenceBucket
            - Name: CB_CAP_PRIVATE_EVIDENCE_KMS_KEY_ARN
              Value: !GetAtt PrivateEvidenceKey.Arn
          Secrets:
            - Name: CB_CAP_DATABASE_PASSWORD
              ValueFrom: !Ref RuntimeDatabasePassword
            - Name: LANGGRAPH_AES_KEY
              ValueFrom: !Ref CheckpointEncryptionKey
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref RuntimeLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: runtime

  MigrationTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: cbcap-migration
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '512'
      Memory: '1024'
      ExecutionRoleArn: !GetAtt MigrationTaskExecutionRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: migration
          Image: !Ref RuntimeImageUri
          Essential: true
          Command: [python, -m, cbcap_core.migration_runner]
          Environment:
            - Name: CB_CAP_DATABASE_HOST
              Value: !GetAtt Database.Endpoint.Address
            - Name: CB_CAP_DATABASE_PORT
              Value: !GetAtt Database.Endpoint.Port
            - Name: CB_CAP_DATABASE_NAME
              Value: !Ref DatabaseName
            - {Name: CB_CAP_MIGRATION_ROOT, Value: /app/sql}
          Secrets:
            - Name: CB_CAP_DATABASE_PASSWORD
              ValueFrom: !Ref RuntimeDatabasePassword
            - Name: CB_CAP_MIGRATION_DATABASE_USERNAME
              ValueFrom: !Join ['', [!GetAtt Database.MasterUserSecret.SecretArn, ':username::']]
            - Name: CB_CAP_MIGRATION_DATABASE_PASSWORD
              ValueFrom: !Join ['', [!GetAtt Database.MasterUserSecret.SecretArn, ':password::']]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref RuntimeLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: migration

  MembershipAdminTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: cbcap-membership-admin
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt MembershipAdminTaskExecutionRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: membership-admin
          Image: !Ref RuntimeImageUri
          Essential: true
          Command: [python, -m, cbcap_core.membership_admin]
          Environment:
            - Name: CB_CAP_DATABASE_HOST
              Value: !GetAtt Database.Endpoint.Address
            - Name: CB_CAP_DATABASE_PORT
              Value: !GetAtt Database.Endpoint.Port
            - Name: CB_CAP_DATABASE_NAME
              Value: !Ref DatabaseName
          Secrets:
            - Name: CB_CAP_MIGRATION_DATABASE_USERNAME
              ValueFrom: !Join ['', [!GetAtt Database.MasterUserSecret.SecretArn, ':username::']]
            - Name: CB_CAP_MIGRATION_DATABASE_PASSWORD
              ValueFrom: !Join ['', [!GetAtt Database.MasterUserSecret.SecretArn, ':password::']]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref RuntimeLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: membership-admin

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Product
          Value: CB-CAP

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      SecurityGroups:
        - !GetAtt LoadBalancerSecurityGroup.GroupId
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      LoadBalancerAttributes:
        - {Key: deletion_protection.enabled, Value: 'true'}
        - {Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true'}
        - {Key: routing.http.desync_mitigation_mode, Value: strictest}
        - {Key: routing.http2.enabled, Value: 'true'}
        - {Key: idle_timeout.timeout_seconds, Value: '120'}
      Tags:
        - Key: Product
          Value: CB-CAP

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 8080
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /readyz
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: '30'}

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            StatusCode: HTTP_301

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref Certificate
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '404'
            ContentType: application/json
            MessageBody: '{"detail":"not_found"}'

  HttpsHostRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 1
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values:
              - !Ref DomainName
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: cbcap-runtime-waf
        SampledRequestsEnabled: true
      Rules:
        - Name: AwsCommonRuleSet
          Priority: 10
          OverrideAction: {None: {}}
          Statement:
            ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesCommonRuleSet}
          VisibilityConfig: {CloudWatchMetricsEnabled: true, MetricName: cbcap-common-rules, SampledRequestsEnabled: true}
        - Name: AwsKnownBadInputs
          Priority: 20
          OverrideAction: {None: {}}
          Statement:
            ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesKnownBadInputsRuleSet}
          VisibilityConfig: {CloudWatchMetricsEnabled: true, MetricName: cbcap-bad-inputs, SampledRequestsEnabled: true}
        - Name: AwsIpReputation
          Priority: 30
          OverrideAction: {None: {}}
          Statement:
            ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesAmazonIpReputationList}
          VisibilityConfig: {CloudWatchMetricsEnabled: true, MetricName: cbcap-ip-reputation, SampledRequestsEnabled: true}
        - Name: PerIpRateLimit
          Priority: 40
          Action: {Block: {}}
          Statement:
            RateBasedStatement: {AggregateKeyType: IP, Limit: 1200}
          VisibilityConfig: {CloudWatchMetricsEnabled: true, MetricName: cbcap-rate-limit, SampledRequestsEnabled: true}

  WebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Ref LoadBalancer
      WebACLArn: !GetAtt WebAcl.Arn

  RuntimeService:
    Type: AWS::ECS::Service
    DependsOn: [HttpsHostRule, WebAclAssociation]
    Properties:
      ServiceName: cbcap-runtime
      Cluster: !Ref EcsCluster
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DesiredCount: !Ref DesiredCount
      EnableExecuteCommand: false
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      HealthCheckGracePeriodSeconds: 90
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !GetAtt RuntimeSecurityGroup.GroupId
          Subnets:
            - !Ref PublicSubnetA
            - !Ref PublicSubnetB
      LoadBalancers:
        - ContainerName: runtime
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup
      TaskDefinition: !Ref RuntimeTaskDefinition
      Tags:
        - {Key: Product, Value: CB-CAP}
        - {Key: DataBoundary, Value: Private}

  ApiDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID
        EvaluateTargetHealth: true

Outputs:
  ApiUrl:
    Value: !Sub 'https://${DomainName}'
  ClusterName:
    Value: !Ref EcsCluster
  RuntimeServiceName:
    Value: !GetAtt RuntimeService.Name
  RuntimeTaskDefinitionArn:
    Value: !Ref RuntimeTaskDefinition
  MigrationTaskDefinitionArn:
    Value: !Ref MigrationTaskDefinition
  MembershipAdminTaskDefinitionArn:
    Value: !Ref MembershipAdminTaskDefinition
  RuntimeSecurityGroupId:
    Value: !GetAtt RuntimeSecurityGroup.GroupId
  PublicSubnetIds:
    Value: !Join [',', [!Ref PublicSubnetA, !Ref PublicSubnetB]]
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
