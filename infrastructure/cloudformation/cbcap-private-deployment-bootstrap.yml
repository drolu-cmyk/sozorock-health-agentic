AWSTemplateFormatVersion: '2010-09-09'
Description: One-time IAM bootstrap for the private CB-CAP GitHub production deployment.

Parameters:
  GitHubOidcProviderArn:
    Type: String
    Default: arn:aws:iam::791860731989:oidc-provider/token.actions.githubusercontent.com
    AllowedPattern: '^arn:aws:iam::[0-9]{12}:oidc-provider/token\.actions\.githubusercontent\.com$'
  GitHubRepository:
    Type: String
    Default: drolu-cmyk/sozorock-health-agentic
    AllowedPattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
  GitHubEnvironment:
    Type: String
    Default: production
    AllowedPattern: '^[A-Za-z0-9_.-]+$'
  RuntimeStackPrefix:
    Type: String
    Default: cbcap-private-
    AllowedPattern: '^[a-z0-9-]+-$'
  RuntimeRepositoryName:
    Type: String
    Default: sozorock/cbcap-runtime
    AllowedPattern: '^[a-z0-9]+(?:[._/-][a-z0-9]+)*$'
  HostedZoneId:
    Type: String
    Default: Z07905293AANZWGYZ84F3
    AllowedPattern: '^Z[A-Z0-9]+$'

Resources:
  CloudFormationServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cbcap-private-cloudformation
      Description: Service role used only by the private CB-CAP CloudFormation stacks.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CbcapPrivateInfrastructure
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: NetworkAndCompute
                Effect: Allow
                Action:
                  - ec2:CreateVpc
                  - ec2:DeleteVpc
                  - ec2:DescribeVpcs
                  - ec2:ModifyVpcAttribute
                  - ec2:CreateInternetGateway
                  - ec2:DeleteInternetGateway
                  - ec2:AttachInternetGateway
                  - ec2:DetachInternetGateway
                  - ec2:DescribeInternetGateways
                  - ec2:CreateSubnet
                  - ec2:DeleteSubnet
                  - ec2:DescribeSubnets
                  - ec2:ModifySubnetAttribute
                  - ec2:CreateRouteTable
                  - ec2:DeleteRouteTable
                  - ec2:DescribeRouteTables
                  - ec2:AssociateRouteTable
                  - ec2:DisassociateRouteTable
                  - ec2:CreateRoute
                  - ec2:DeleteRoute
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteSecurityGroup
                  - ec2:DescribeSecurityGroups
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:CreateTags
                  - ec2:DeleteTags
                  - ec2:DescribeAvailabilityZones
                  - ecs:*
                  - elasticloadbalancing:*
                Resource: '*'
              - Sid: ManagedDataAndIdentityServices
                Effect: Allow
                Action:
                  - rds:*
                  - cognito-idp:*
                  - secretsmanager:*
                  - logs:*
                  - ecr:CreateRepository
                  - ecr:DeleteRepository
                  - ecr:DescribeRepositories
                  - ecr:PutLifecyclePolicy
                  - ecr:DeleteLifecyclePolicy
                  - ecr:PutImageScanningConfiguration
                  - ecr:PutImageTagMutability
                  - ecr:TagResource
                  - ecr:UntagResource
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:GetBucketPolicy
                  - s3:PutBucketPolicy
                  - s3:DeleteBucketPolicy
                  - s3:GetBucketVersioning
                  - s3:PutBucketVersioning
                  - s3:GetEncryptionConfiguration
                  - s3:PutEncryptionConfiguration
                  - s3:GetBucketPublicAccessBlock
                  - s3:PutBucketPublicAccessBlock
                  - s3:GetBucketOwnershipControls
                  - s3:PutBucketOwnershipControls
                  - s3:GetBucketTagging
                  - s3:PutBucketTagging
                  - s3:ListBucket
                  - s3:GetObject
                  - s3:DeleteObject
                  - kms:CreateKey
                  - kms:DescribeKey
                  - kms:EnableKeyRotation
                  - kms:DisableKeyRotation
                  - kms:ScheduleKeyDeletion
                  - kms:CancelKeyDeletion
                  - kms:GetKeyPolicy
                  - kms:PutKeyPolicy
                  - kms:TagResource
                  - kms:UntagResource
                  - kms:CreateAlias
                  - kms:UpdateAlias
                  - kms:DeleteAlias
                  - kms:ListAliases
                  - acm:RequestCertificate
                  - acm:DescribeCertificate
                  - acm:DeleteCertificate
                  - acm:AddTagsToCertificate
                  - acm:RemoveTagsFromCertificate
                  - wafv2:*
                Resource: '*'
              - Sid: FoundationDnsOnly
                Effect: Allow
                Action:
                  - route53:GetHostedZone
                  - route53:ListResourceRecordSets
                  - route53:ChangeResourceRecordSets
                Resource: !Sub arn:${AWS::Partition}:route53:::hostedzone/${HostedZoneId}
              - Sid: DnsChangeStatus
                Effect: Allow
                Action: route53:GetChange
                Resource: !Sub arn:${AWS::Partition}:route53:::change/*
              - Sid: ManageOnlyCbcapStackRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${RuntimeStackPrefix}*

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cbcap-private-github-deploy
      Description: GitHub OIDC role for the private CB-CAP production environment only.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:environment:${GitHubEnvironment}
      Policies:
        - PolicyName: CbcapPrivateRelease
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudFormationOnlyCbcapPrivateStacks
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStackResources
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${RuntimeStackPrefix}*/*
              - Sid: PassOnlyCbcapCloudFormationRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationServiceRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: PublishAndScanOnlyCbcapRuntimeImages
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:DescribeImageScanFindings
                  - ecr:GetDownloadUrlForLayer
                  - ecr:GetLifecyclePolicy
                  - ecr:InitiateLayerUpload
                  - ecr:ListImages
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${RuntimeRepositoryName}
              - Sid: RunOnlyCbcapMigrationTasks
                Effect: Allow
                Action: ecs:RunTask
                Resource: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/cbcap-migration:*
                Condition:
                  ArnEquals:
                    ecs:cluster: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/cbcap-private-runtime
              - Sid: InspectCbcapRuntimeTasksAndService
                Effect: Allow
                Action:
                  - ecs:DescribeTasks
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                Resource: '*'
              - Sid: PassOnlyCbcapRuntimeTaskRoles
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${RuntimeStackPrefix}*
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com

Outputs:
  GitHubDeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
    Description: Set this as the production environment variable CBCAP_PRIVATE_AWS_DEPLOY_ROLE_ARN.
  CloudFormationServiceRoleArn:
    Value: !GetAtt CloudFormationServiceRole.Arn
    Description: Set this as the production environment variable CBCAP_PRIVATE_CLOUDFORMATION_ROLE_ARN.
