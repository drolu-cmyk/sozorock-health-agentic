AWSTemplateFormatVersion: '2010-09-09'
Description: Governed AWS production runtime for the CB-CAP Node agentic control plane.

Parameters:
  RuntimeImageUri:
    Type: String
    MinLength: 40
  DomainName:
    Type: String
    Default: api.cbcap.sozorockfoundation.org
    AllowedPattern: '^[A-Za-z0-9.-]+$'
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Default: Z07905293AANZWGYZ84F3
  DatabaseName:
    Type: String
    Default: cbcap
    AllowedPattern: '^[A-Za-z][A-Za-z0-9_]{0,62}$'
  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.micro
  DesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 4
  ActivationEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  OpenAIApiKeySecretArn:
    Type: String
    MinLength: 20
    AllowedPattern: '^arn:[A-Za-z0-9-]+:secretsmanager:[A-Za-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+$'
  AgentModel:
    Type: String
    AllowedPattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{2,119}$'
  AgentPromptVersion:
    Type: String
    AllowedPattern: '^[a-z0-9][a-z0-9._-]{5,119}$'
  AgentKillSwitch:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  LogRetentionDays:
    Type: Number
    Default: 90
    AllowedValues: [30, 60, 90, 120, 150, 180, 365]

Conditions:
  ActivateRuntime: !Equals [!Ref ActivationEnabled, 'true']

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.43.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - {Key: Name, Value: cbcap-agentic-production}
        - {Key: Product, Value: CB-CAP}

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.43.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - {Key: Name, Value: cbcap-agentic-public-a}

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.43.1.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - {Key: Name, Value: cbcap-agentic-public-b}

  PublicSubnetARoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  DatabaseSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.43.10.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - {Key: Name, Value: cbcap-agentic-db-a}

  DatabaseSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.43.11.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - {Key: Name, Value: cbcap-agentic-db-b}

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Isolated database subnets for CB-CAP agentic production.
      SubnetIds: [!Ref DatabaseSubnetA, !Ref DatabaseSubnetB]

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTPS ingress for CB-CAP agentic API.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 8080, ToPort: 8080, CidrIp: 10.43.0.0/16}

  RuntimeSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Runtime tasks accept only ALB traffic and reach HTTPS plus PostgreSQL.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !GetAtt LoadBalancerSecurityGroup.GroupId
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 5432, ToPort: 5432, CidrIp: 10.43.0.0/16}

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL accepts only CB-CAP runtime and migration tasks.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !GetAtt RuntimeSecurityGroup.GroupId

  RuntimeDatabasePassword:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: cbcap-agentic/runtime-database-password
      Description: Password for the least-privilege CB-CAP PostgreSQL runtime role.
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true
        RequireEachIncludedType: true

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: cbcap-agentic-production
      Engine: postgres
      DBName: !Ref DatabaseName
      MasterUsername: cbcap_admin
      ManageMasterUserPassword: true
      DBInstanceClass: !Ref DatabaseInstanceClass
      AllocatedStorage: 20
      MaxAllocatedStorage: 100
      StorageType: gp3
      StorageEncrypted: true
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!GetAtt DatabaseSecurityGroup.GroupId]
      BackupRetentionPeriod: 7
      DeleteAutomatedBackups: false
      DeletionProtection: true
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
      EnableCloudwatchLogsExports: [postgresql, upgrade]
      Tags:
        - {Key: Product, Value: CB-CAP}
        - {Key: DataBoundary, Value: Private}

  PrivateEvidenceKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: KMS key for tenant-private CB-CAP evidence.
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: RootAccountControl
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'

  PrivateEvidenceKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/cbcap-agentic-private-evidence
      TargetKeyId: !Ref PrivateEvidenceKey

  PrivateEvidenceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt PrivateEvidenceKey.Arn
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: GovernNoncurrentVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 3650
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - {Key: Product, Value: CB-CAP}
        - {Key: DataBoundary, Value: TenantPrivate}

  PrivateEvidenceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PrivateEvidenceBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt PrivateEvidenceBucket.Arn, !Sub '${PrivateEvidenceBucket.Arn}/*']
            Condition:
              Bool: {aws:SecureTransport: false}
          - Sid: RequireKmsEncryption
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${PrivateEvidenceBucket.Arn}/*'
            Condition:
              StringNotEquals: {s3:x-amz-server-side-encryption: aws:kms}
          - Sid: RequireApprovedKmsKey
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${PrivateEvidenceBucket.Arn}/*'
            Condition:
              StringNotEquals:
                s3:x-amz-server-side-encryption-aws-kms-key-id: !GetAtt PrivateEvidenceKey.Arn

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: cbcap-agentic-workspace
      DeletionProtection: ACTIVE
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      MfaConfiguration: ON
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - {Name: verified_email, Priority: 1}
      Policies:
        PasswordPolicy:
          MinimumLength: 14
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 3
      Schema:
        - Name: tenant_id
          AttributeDataType: String
          Mutable: true
          StringAttributeConstraints: {MinLength: '1', MaxLength: '200'}
        - Name: workspace_role
          AttributeDataType: String
          Mutable: true
          StringAttributeConstraints: {MinLength: '1', MaxLength: '80'}
        - Name: workspace_access
          AttributeDataType: String
          Mutable: true
          StringAttributeConstraints: {MinLength: '1', MaxLength: '40'}

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: cbcap-agentic-web
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 30
      TokenValidityUnits: {AccessToken: minutes, IdToken: minutes, RefreshToken: days}
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs: ['https://cbcap.sozorockfoundation.org/auth/callback']
      LogoutURLs: ['https://cbcap.sozorockfoundation.org/']
      SupportedIdentityProviders: [COGNITO]

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub cbcap-sozorock-${AWS::AccountId}
      UserPoolId: !Ref UserPool

  RuntimeLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /sozorock/cbcap/agentic-runtime
      RetentionInDays: !Ref LogRetentionDays

  IncidentTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: cbcap-agentic-production-incidents
      KmsMasterKeyId: alias/aws/sns
      Tags:
        - {Key: Product, Value: CB-CAP}

  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: cbcap-agentic-production
      ClusterSettings:
        - {Name: containerInsights, Value: enabled}

  RuntimeTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cbcap-agentic-runtime-execution
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadRuntimeInjectedSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref RuntimeDatabasePassword
                  - !Ref OpenAIApiKeySecretArn

  RuntimeTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cbcap-agentic-runtime-application
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadTenantPrivateEvidenceMetadata
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListTenantPrivateEvidence
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt PrivateEvidenceBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: tenant-evidence/*
              - Sid: ReadTenantPrivateEvidenceMetadata
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub '${PrivateEvidenceBucket.Arn}/tenant-evidence/*'

  MigrationTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cbcap-agentic-runtime-migration-execution
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadMigrationPasswords
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref RuntimeDatabasePassword, !GetAtt Database.MasterUserSecret.SecretArn]

  RuntimeTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: cbcap-agentic-runtime
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '512'
      Memory: '1024'
      ExecutionRoleArn: !GetAtt RuntimeTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt RuntimeTaskRole.Arn
      RuntimePlatform: {CpuArchitecture: X86_64, OperatingSystemFamily: LINUX}
      ContainerDefinitions:
        - Name: runtime
          Image: !Ref RuntimeImageUri
          Essential: true
          ReadonlyRootFilesystem: true
          LinuxParameters: {InitProcessEnabled: true}
          PortMappings:
            - {ContainerPort: 8080, Protocol: tcp}
          Environment:
            - {Name: PORT, Value: '8080'}
            - {Name: AWS_REGION, Value: !Ref 'AWS::Region'}
            - {Name: EVIDENCE_GATEWAY_ORIGIN, Value: 'https://health.sozorockfoundation.org'}
            - {Name: AGENTIC_ALLOWED_ORIGINS, Value: 'https://cbcap.sozorockfoundation.org;https://health.sozorockfoundation.org'}
            - {Name: AGENTIC_ALLOWED_HOSTS, Value: !Ref DomainName}
            - {Name: ENABLE_UNAUTHENTICATED_CBCAP_DEV, Value: 'false'}
            - {Name: ENABLE_LEGACY_SESSIONS, Value: 'false'}
            - {Name: CB_CAP_DATABASE_HOST, Value: !GetAtt Database.Endpoint.Address}
            - {Name: CB_CAP_DATABASE_PORT, Value: !GetAtt Database.Endpoint.Port}
            - {Name: CB_CAP_DATABASE_NAME, Value: !Ref DatabaseName}
            - {Name: CB_CAP_DATABASE_USERNAME, Value: cbcap_runtime}
            - {Name: CB_CAP_DATABASE_CA_FILE, Value: /app/certs/global-bundle.pem}
            - {Name: CB_CAP_COGNITO_USER_POOL_ID, Value: !Ref UserPool}
            - {Name: CB_CAP_COGNITO_APP_CLIENT_ID, Value: !Ref UserPoolClient}
            - {Name: CB_CAP_PRIVATE_EVIDENCE_BUCKET, Value: !Ref PrivateEvidenceBucket}
            - {Name: CB_CAP_PRIVATE_EVIDENCE_KMS_KEY_ARN, Value: !GetAtt PrivateEvidenceKey.Arn}
            - {Name: CB_CAP_AGENT_MODEL, Value: !Ref AgentModel}
            - {Name: CB_CAP_AGENT_PROMPT_VERSION, Value: !Ref AgentPromptVersion}
            - {Name: CB_CAP_AGENT_KILL_SWITCH, Value: !Ref AgentKillSwitch}
          Secrets:
            - Name: CB_CAP_DATABASE_PASSWORD
              ValueFrom: !Ref RuntimeDatabasePassword
            - Name: OPENAI_API_KEY
              ValueFrom: !Ref OpenAIApiKeySecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref RuntimeLogGroup
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: runtime

  MigrationTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: cbcap-agentic-migration
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '512'
      Memory: '1024'
      ExecutionRoleArn: !GetAtt MigrationTaskExecutionRole.Arn
      RuntimePlatform: {CpuArchitecture: X86_64, OperatingSystemFamily: LINUX}
      ContainerDefinitions:
        - Name: migration
          Image: !Ref RuntimeImageUri
          Essential: true
          ReadonlyRootFilesystem: true
          LinuxParameters: {InitProcessEnabled: true}
          Command: [node, scripts/migrate-postgres.js]
          Environment:
            - {Name: CB_CAP_DATABASE_HOST, Value: !GetAtt Database.Endpoint.Address}
            - {Name: CB_CAP_DATABASE_PORT, Value: !GetAtt Database.Endpoint.Port}
            - {Name: CB_CAP_DATABASE_NAME, Value: !Ref DatabaseName}
            - {Name: CB_CAP_MIGRATION_DATABASE_USERNAME, Value: cbcap_admin}
            - {Name: CB_CAP_DATABASE_CA_FILE, Value: /app/certs/global-bundle.pem}
            - {Name: CB_CAP_MIGRATION_ROOT, Value: /app/infrastructure/postgres}
          Secrets:
            - Name: CB_CAP_DATABASE_PASSWORD
              ValueFrom: !Ref RuntimeDatabasePassword
            - Name: CB_CAP_MIGRATION_DATABASE_PASSWORD
              ValueFrom: !Sub '${Database.MasterUserSecret.SecretArn}:password::'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref RuntimeLogGroup
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: migration

  PreflightTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: cbcap-agentic-preflight
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '512'
      Memory: '1024'
      ExecutionRoleArn: !GetAtt RuntimeTaskExecutionRole.Arn
      RuntimePlatform: {CpuArchitecture: X86_64, OperatingSystemFamily: LINUX}
      ContainerDefinitions:
        - Name: preflight
          Image: !Ref RuntimeImageUri
          Essential: true
          ReadonlyRootFilesystem: true
          LinuxParameters: {InitProcessEnabled: true}
          Command: [node, scripts/run-production-preflight.js]
          Environment:
            - {Name: AWS_REGION, Value: !Ref 'AWS::Region'}
            - {Name: EVIDENCE_GATEWAY_ORIGIN, Value: 'https://health.sozorockfoundation.org'}
            - {Name: AGENTIC_ALLOWED_ORIGINS, Value: 'https://cbcap.sozorockfoundation.org;https://health.sozorockfoundation.org'}
            - {Name: AGENTIC_ALLOWED_HOSTS, Value: !Ref DomainName}
            - {Name: ENABLE_UNAUTHENTICATED_CBCAP_DEV, Value: 'false'}
            - {Name: ENABLE_LEGACY_SESSIONS, Value: 'false'}
            - {Name: CB_CAP_DATABASE_HOST, Value: !GetAtt Database.Endpoint.Address}
            - {Name: CB_CAP_DATABASE_PORT, Value: !GetAtt Database.Endpoint.Port}
            - {Name: CB_CAP_DATABASE_NAME, Value: !Ref DatabaseName}
            - {Name: CB_CAP_DATABASE_USERNAME, Value: cbcap_runtime}
            - {Name: CB_CAP_DATABASE_CA_FILE, Value: /app/certs/global-bundle.pem}
            - {Name: CB_CAP_PRODUCTION_READINESS_ADAPTER, Value: /app/scripts/production-readiness-adapter.js}
            - {Name: CB_CAP_AGENT_MODEL, Value: !Ref AgentModel}
            - {Name: CB_CAP_AGENT_PROMPT_VERSION, Value: !Ref AgentPromptVersion}
            - {Name: CB_CAP_AGENT_KILL_SWITCH, Value: !Ref AgentKillSwitch}
          Secrets:
            - Name: CB_CAP_DATABASE_PASSWORD
              ValueFrom: !Ref RuntimeDatabasePassword
            - Name: OPENAI_API_KEY
              ValueFrom: !Ref OpenAIApiKeySecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref RuntimeLogGroup
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: preflight

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - {DomainName: !Ref DomainName, HostedZoneId: !Ref HostedZoneId}
      Tags:
        - {Key: Product, Value: CB-CAP}

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      SecurityGroups: [!GetAtt LoadBalancerSecurityGroup.GroupId]
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      LoadBalancerAttributes:
        - {Key: deletion_protection.enabled, Value: 'true'}
        - {Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true'}
        - {Key: routing.http.desync_mitigation_mode, Value: strictest}
        - {Key: routing.http2.enabled, Value: 'true'}
      Tags:
        - {Key: Product, Value: CB-CAP}

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 8080
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /readyz
      HealthCheckProtocol: HTTP
      Matcher: {HttpCode: '200'}
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: '30'}

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: {Protocol: HTTPS, Port: '443', StatusCode: HTTP_301}

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates: [{CertificateArn: !Ref Certificate}]
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '503'
            ContentType: application/json
            MessageBody: '{"status":"institutional_runtime_disabled"}'

  HttpsHostRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: ActivateRuntime
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 1
      Conditions:
        - Field: host-header
          HostHeaderConfig: {Values: [!Ref DomainName]}
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Scope: REGIONAL
      DefaultAction: {Allow: {}}
      VisibilityConfig: {CloudWatchMetricsEnabled: true, MetricName: cbcap-agentic-waf, SampledRequestsEnabled: true}
      Rules:
        - Name: AwsCommonRuleSet
          Priority: 10
          OverrideAction: {None: {}}
          Statement:
            ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesCommonRuleSet}
          VisibilityConfig: {CloudWatchMetricsEnabled: true, MetricName: cbcap-agentic-common, SampledRequestsEnabled: true}
        - Name: AwsKnownBadInputs
          Priority: 20
          OverrideAction: {None: {}}
          Statement:
            ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesKnownBadInputsRuleSet}
          VisibilityConfig: {CloudWatchMetricsEnabled: true, MetricName: cbcap-agentic-bad-inputs, SampledRequestsEnabled: true}
        - Name: AwsIpReputation
          Priority: 30
          OverrideAction: {None: {}}
          Statement:
            ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesAmazonIpReputationList}
          VisibilityConfig: {CloudWatchMetricsEnabled: true, MetricName: cbcap-agentic-ip-reputation, SampledRequestsEnabled: true}
        - Name: PerIpRateLimit
          Priority: 40
          Action: {Block: {}}
          Statement:
            RateBasedStatement: {AggregateKeyType: IP, Limit: 1200}
          VisibilityConfig: {CloudWatchMetricsEnabled: true, MetricName: cbcap-agentic-rate, SampledRequestsEnabled: true}

  WebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Ref LoadBalancer
      WebACLArn: !GetAtt WebAcl.Arn

  RuntimeService:
    Type: AWS::ECS::Service
    DependsOn: [HttpsListener, WebAclAssociation]
    Properties:
      ServiceName: cbcap-agentic-runtime
      Cluster: !Ref EcsCluster
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DesiredCount: !Ref DesiredCount
      EnableExecuteCommand: false
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups: [!GetAtt RuntimeSecurityGroup.GroupId]
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      LoadBalancers:
        - {ContainerName: runtime, ContainerPort: 8080, TargetGroupArn: !Ref TargetGroup}
      TaskDefinition: !Ref RuntimeTaskDefinition
      Tags:
        - {Key: Product, Value: CB-CAP}
        - {Key: Runtime, Value: agentic-node}

  UnhealthyTargetAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: cbcap-agentic-unhealthy-targets
      AlarmDescription: CB-CAP production has unhealthy runtime targets.
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - {Name: TargetGroup, Value: !GetAtt TargetGroup.TargetGroupFullName}
        - {Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName}
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref IncidentTopic]

  ApiDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID
        EvaluateTargetHealth: true

Outputs:
  OpenAIApiKeySecretArn: {Value: !Ref OpenAIApiKeySecretArn}
  ApiUrl: {Value: !Sub 'https://${DomainName}'}
  ClusterName: {Value: !Ref EcsCluster}
  RuntimeServiceName: {Value: !GetAtt RuntimeService.Name}
  RuntimeTaskDefinitionArn: {Value: !Ref RuntimeTaskDefinition}
  MigrationTaskDefinitionArn: {Value: !Ref MigrationTaskDefinition}
  PreflightTaskDefinitionArn: {Value: !Ref PreflightTaskDefinition}
  RuntimeSecurityGroupId: {Value: !GetAtt RuntimeSecurityGroup.GroupId}
  PublicSubnetIds: {Value: !Join [',', [!Ref PublicSubnetA, !Ref PublicSubnetB]]}
  DatabaseIdentifier: {Value: !Ref Database}
  DatabaseEndpoint: {Value: !GetAtt Database.Endpoint.Address}
  DatabaseSecurityGroupId: {Value: !GetAtt DatabaseSecurityGroup.GroupId}
  DatabaseSubnetGroupName: {Value: !Ref DatabaseSubnetGroup}
  RuntimeDatabasePasswordArn: {Value: !Ref RuntimeDatabasePassword}
  UserPoolId: {Value: !Ref UserPool}
  UserPoolClientId: {Value: !Ref UserPoolClient}
  CognitoIssuerUrl: {Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'}
  CognitoHostedUiDomain: {Value: !Sub 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'}
  CognitoOAuthCallbackUrl: {Value: 'https://cbcap.sozorockfoundation.org/auth/callback'}
  CognitoOAuthLogoutUrl: {Value: 'https://cbcap.sozorockfoundation.org/'}
  PrivateEvidenceBucketName: {Value: !Ref PrivateEvidenceBucket}
  PrivateEvidenceKmsKeyArn: {Value: !GetAtt PrivateEvidenceKey.Arn}
  RuntimeLogGroupName: {Value: !Ref RuntimeLogGroup}
  IncidentTopicArn: {Value: !Ref IncidentTopic}
  UnhealthyTargetAlarmArn: {Value: !GetAtt UnhealthyTargetAlarm.Arn}
  CertificateArn: {Value: !Ref Certificate}
  LoadBalancerArn: {Value: !Ref LoadBalancer}
  TargetGroupArn: {Value: !Ref TargetGroup}
  WebAclArn: {Value: !GetAtt WebAcl.Arn}
