name: Deploy private CB-CAP runtime

on:
  workflow_dispatch:

concurrency:
  group: cbcap-private-runtime-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Verify, migrate, release, and prove private runtime
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_PAGER: ""
      EXPECTED_AWS_ACCOUNT_ID: "791860731989"
      ECR_REPOSITORY: sozorock/cbcap-runtime
      REGISTRY_STACK: cbcap-private-runtime-registry
      RUNTIME_STACK: cbcap-private-runtime
      API_DOMAIN: api.cbcap.sozorockfoundation.org
      WORKSPACE_ORIGIN: https://cbcap.sozorockfoundation.org
      CB_CAP_EVIDENCE_GATEWAY_URL: https://health.sozorockfoundation.org/api/evidence/v1/gateway
      DEPLOY_ROLE_ARN: ${{ vars.CBCAP_PRIVATE_AWS_DEPLOY_ROLE_ARN }}
      CLOUDFORMATION_ROLE_ARN: ${{ vars.CBCAP_PRIVATE_CLOUDFORMATION_ROLE_ARN }}

    steps:
      - name: Check out the approved private source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false

      - name: Use Node.js 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      - name: Use Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Execute repository release gates
        run: |
          set -euo pipefail
          npm install --package-lock=false --ignore-scripts
          npm test
          python -m pip install --upgrade pip
          python -m pip install -e "python/cbcap_core[test,production]"
          python -m pip check
          pytest python/cbcap_core/tests

          approved_commit=$(git rev-parse HEAD)
          origin_main=$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')
          test -n "$origin_main"
          test "$origin_main" = "$approved_commit"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "APPROVED_COMMIT=$approved_commit" >> "$GITHUB_ENV"

      - name: Prove the five-county public evidence dependency
        run: |
          set -euo pipefail
          python -m cbcap_core.release_evaluation > /tmp/cbcap-five-county-evaluation.json
          jq -e '.contract == "sozorock.evidence-gateway.v1"' /tmp/cbcap-five-county-evaluation.json >/dev/null
          jq -e '.counties | length == 5' /tmp/cbcap-five-county-evaluation.json >/dev/null
          jq -e 'all(.counties[]; (.release_hash | test("^sha256:[0-9a-f]{64}$")))' /tmp/cbcap-five-county-evaluation.json >/dev/null
          cat /tmp/cbcap-five-county-evaluation.json

      - name: Require governed AWS deployment configuration
        run: |
          set -euo pipefail
          test -n "$DEPLOY_ROLE_ARN"
          test -n "$CLOUDFORMATION_ROLE_ARN"

      - name: Assume the private production deployment role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          role-session-name: cbcap-private-production-release
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify the AWS account boundary
        run: |
          set -euo pipefail
          account_id=$(aws sts get-caller-identity --query Account --output text)
          test "$account_id" = "$EXPECTED_AWS_ACCOUNT_ID"

      - name: Provision the immutable runtime registry
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name "$REGISTRY_STACK" \
            --template-file infrastructure/cloudformation/cbcap-runtime-registry.yml \
            --role-arn "$CLOUDFORMATION_ROLE_ARN" \
            --parameter-overrides RepositoryName="$ECR_REPOSITORY" \
            --no-fail-on-empty-changeset

          repository_uri=$(aws cloudformation describe-stacks \
            --stack-name "$REGISTRY_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='RepositoryUri'].OutputValue" \
            --output text)
          test -n "$repository_uri"
          echo "REPOSITORY_URI=$repository_uri" >> "$GITHUB_ENV"
          echo "RUNTIME_IMAGE_URI=$repository_uri:$APPROVED_COMMIT" >> "$GITHUB_ENV"

      - name: Publish or reuse the immutable runtime image
        run: |
          set -euo pipefail

          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$APPROVED_COMMIT" \
            --output json > /tmp/cbcap-existing-image.json 2> /tmp/cbcap-existing-image.err; then
            digest=$(jq -r '.imageDetails[0].imageDigest // ""' /tmp/cbcap-existing-image.json)
            test "$digest" != ""
            echo "Reusing immutable ECR image $APPROVED_COMMIT at $digest."
          elif grep -q 'ImageNotFoundException' /tmp/cbcap-existing-image.err; then
            registry_host="${REPOSITORY_URI%%/*}"
            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "$registry_host"

            docker build \
              --file Dockerfile.runtime \
              --tag "$RUNTIME_IMAGE_URI" \
              .
            docker push "$RUNTIME_IMAGE_URI"
          else
            cat /tmp/cbcap-existing-image.err
            exit 1
          fi

      - name: Require a clean ECR vulnerability scan
        run: |
          set -euo pipefail
          aws ecr wait image-scan-complete \
            --repository-name "$ECR_REPOSITORY" \
            --image-id imageTag="$APPROVED_COMMIT"

          findings=$(aws ecr describe-image-scan-findings \
            --repository-name "$ECR_REPOSITORY" \
            --image-id imageTag="$APPROVED_COMMIT" \
            --output json)
          status=$(jq -r '.imageScanStatus.status // "UNKNOWN"' <<<"$findings")
          critical=$(jq -r '.imageScanFindings.findingSeverityCounts.CRITICAL // 0' <<<"$findings")
          high=$(jq -r '.imageScanFindings.findingSeverityCounts.HIGH // 0' <<<"$findings")
          test "$status" = "COMPLETE"
          test "$critical" = "0"
          test "$high" = "0"

      - name: Provision private infrastructure with runtime disabled
        run: |
          set -euo pipefail

          if stack_json=$(aws cloudformation describe-stacks \
            --stack-name "$RUNTIME_STACK" \
            --output json 2> /tmp/cbcap-runtime-stack.err); then
            stack_status=$(jq -r '.Stacks[0].StackStatus // ""' <<<"$stack_json")
            case "$stack_status" in
              CREATE_FAILED)
                rollback_flag=--disable-rollback
                ;;
              CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE)
                rollback_flag=--no-disable-rollback
                ;;
              *)
                echo "Refusing private runtime deployment from unexpected stack state: $stack_status"
                exit 1
                ;;
            esac
          elif grep -q 'ValidationError' /tmp/cbcap-runtime-stack.err; then
            rollback_flag=--disable-rollback
          else
            cat /tmp/cbcap-runtime-stack.err
            exit 1
          fi

          aws cloudformation deploy \
            --stack-name "$RUNTIME_STACK" \
            --template-file infrastructure/cloudformation/cbcap-private-runtime.yml \
            --capabilities CAPABILITY_IAM \
            --role-arn "$CLOUDFORMATION_ROLE_ARN" \
            "$rollback_flag" \
            --parameter-overrides \
              RuntimeImageUri="$RUNTIME_IMAGE_URI" \
              DesiredCount=0 \
            --no-fail-on-empty-changeset

          cluster=$(aws cloudformation describe-stacks \
            --stack-name "$RUNTIME_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='ClusterName'].OutputValue" \
            --output text)
          migration_task=$(aws cloudformation describe-stacks \
            --stack-name "$RUNTIME_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='MigrationTaskDefinitionArn'].OutputValue" \
            --output text)
          security_group=$(aws cloudformation describe-stacks \
            --stack-name "$RUNTIME_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='RuntimeSecurityGroupId'].OutputValue" \
            --output text)
          subnets=$(aws cloudformation describe-stacks \
            --stack-name "$RUNTIME_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='PublicSubnetIds'].OutputValue" \
            --output text)
          test -n "$cluster"
          test -n "$migration_task"
          test -n "$security_group"
          test -n "$subnets"
          echo "ECS_CLUSTER=$cluster" >> "$GITHUB_ENV"
          echo "MIGRATION_TASK=$migration_task" >> "$GITHUB_ENV"
          echo "RUNTIME_SECURITY_GROUP=$security_group" >> "$GITHUB_ENV"
          echo "RUNTIME_SUBNETS=$subnets" >> "$GITHUB_ENV"

      - name: Apply append-only database migrations before serving traffic
        run: |
          set -euo pipefail
          network_config=$(jq -cn \
            --arg subnets "$RUNTIME_SUBNETS" \
            --arg security_group "$RUNTIME_SECURITY_GROUP" \
            '{awsvpcConfiguration:{subnets:($subnets|split(",")),securityGroups:[$security_group],assignPublicIp:"ENABLED"}}')

          task_arn=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$MIGRATION_TASK" \
            --launch-type FARGATE \
            --network-configuration "$network_config" \
            --query 'tasks[0].taskArn' \
            --output text)
          test -n "$task_arn"
          test "$task_arn" != "None"

          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$task_arn"
          task_json=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$task_arn" \
            --output json)
          exit_code=$(jq -r '.tasks[0].containers[] | select(.name == "migration") | .exitCode // -1' <<<"$task_json")
          if [[ "$exit_code" != "0" ]]; then
            jq '{failures,task:{stoppedReason:.tasks[0].stoppedReason,stopCode:.tasks[0].stopCode,containers:.tasks[0].containers|map({name,reason,exitCode})}}' <<<"$task_json"
            exit 1
          fi

      - name: Enable one governed runtime task after migrations succeed
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name "$RUNTIME_STACK" \
            --template-file infrastructure/cloudformation/cbcap-private-runtime.yml \
            --capabilities CAPABILITY_IAM \
            --role-arn "$CLOUDFORMATION_ROLE_ARN" \
            --no-disable-rollback \
            --parameter-overrides \
              RuntimeImageUri="$RUNTIME_IMAGE_URI" \
              DesiredCount=1 \
            --no-fail-on-empty-changeset

          service=$(aws cloudformation describe-stacks \
            --stack-name "$RUNTIME_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='RuntimeServiceName'].OutputValue" \
            --output text)
          test -n "$service"
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$service"

      - name: Prove live health, readiness, ingress, CORS, and authentication boundaries
        run: |
          set -euo pipefail
          health_url="https://$API_DOMAIN/healthz"
          ready_url="https://$API_DOMAIN/readyz"
          protected_url="https://$API_DOMAIN/v1/tenants/probe/runs/probe"

          for attempt in $(seq 1 30); do
            if curl \
              --proto '=https' \
              --tlsv1.2 \
              --fail \
              --silent \
              --show-error \
              --dump-header /tmp/cbcap-runtime-headers.txt \
              --output /tmp/cbcap-runtime-health.json \
              "$health_url"; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              echo "CB-CAP private runtime health endpoint did not become available."
              exit 1
            fi
            sleep 10
          done

          jq -e '.status == "ok"' /tmp/cbcap-runtime-health.json >/dev/null
          grep -qi '^cache-control: *no-store' /tmp/cbcap-runtime-headers.txt
          grep -qi '^strict-transport-security: *max-age=31536000; includeSubDomains' /tmp/cbcap-runtime-headers.txt
          grep -qi "^content-security-policy: *default-src 'none'; frame-ancestors 'none'; base-uri 'none'" /tmp/cbcap-runtime-headers.txt
          grep -qi '^x-content-type-options: *nosniff' /tmp/cbcap-runtime-headers.txt
          grep -qi '^x-frame-options: *DENY' /tmp/cbcap-runtime-headers.txt
          grep -qi '^referrer-policy: *no-referrer' /tmp/cbcap-runtime-headers.txt
          grep -qi '^permissions-policy: *camera=(), microphone=(), geolocation=()' /tmp/cbcap-runtime-headers.txt
          grep -qi '^x-request-id:' /tmp/cbcap-runtime-headers.txt

          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --silent \
            --show-error \
            "$ready_url" \
            | jq -e '.status == "ready"' >/dev/null

          protected_status=$(curl \
            --proto '=https' \
            --tlsv1.2 \
            --silent \
            --show-error \
            --output /tmp/cbcap-runtime-protected.json \
            --write-out '%{http_code}' \
            "$protected_url")
          test "$protected_status" = "401"
          jq -e '.detail == "authentication_required"' /tmp/cbcap-runtime-protected.json >/dev/null

          allowed_cors_status=$(curl \
            --proto '=https' \
            --tlsv1.2 \
            --silent \
            --show-error \
            --request OPTIONS \
            --header "Origin: $WORKSPACE_ORIGIN" \
            --header 'Access-Control-Request-Method: GET' \
            --dump-header /tmp/cbcap-cors-allowed.txt \
            --output /tmp/cbcap-cors-allowed-body.txt \
            --write-out '%{http_code}' \
            "$protected_url")
          test "$allowed_cors_status" = "200"
          grep -qi "^access-control-allow-origin: *$WORKSPACE_ORIGIN" /tmp/cbcap-cors-allowed.txt
          grep -qi '^access-control-allow-methods:.*GET' /tmp/cbcap-cors-allowed.txt

          bad_cors_status=$(curl \
            --proto '=https' \
            --tlsv1.2 \
            --silent \
            --show-error \
            --request OPTIONS \
            --header 'Origin: https://not-cbcap.example' \
            --header 'Access-Control-Request-Method: GET' \
            --dump-header /tmp/cbcap-cors-denied.txt \
            --output /tmp/cbcap-cors-denied-body.txt \
            --write-out '%{http_code}' \
            "$protected_url")
          test "$bad_cors_status" = "400"
          if grep -qi '^access-control-allow-origin:' /tmp/cbcap-cors-denied.txt; then
            echo "Disallowed browser origin unexpectedly received an allow-origin header."
            exit 1
          fi

          wrong_host_status=$(curl \
            --proto '=https' \
            --tlsv1.2 \
            --silent \
            --show-error \
            --header 'Host: not-cbcap.example' \
            --output /tmp/cbcap-wrong-host.json \
            --write-out '%{http_code}' \
            "$health_url")
          test "$wrong_host_status" = "404"

      - name: Reconfirm immutable release source
        run: |
          set -euo pipefail
          origin_main_after=$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')
          test "$origin_main_after" = "$APPROVED_COMMIT"
