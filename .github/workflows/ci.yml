name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
      - run: npm install --package-lock=false --ignore-scripts
      - run: npm test

  cbcap-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install CB-CAP production and test dependencies
        run: python -m pip install -e "python/cbcap_core[production,test]"
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Run typed contract and service tests
        run: pytest python/cbcap_core/tests
      - name: Build pinned runtime container
        run: docker build --file Dockerfile.runtime --tag cbcap-runtime:test .
      - name: Verify nonroot container identity
        run: test "$(docker image inspect cbcap-runtime:test --format '{{.Config.User}}')" = "10001:10001"
      - name: Smoke test runtime health endpoint
        shell: bash
        run: |
          set -euo pipefail
          container_id=$(docker run --detach --rm --publish 127.0.0.1:18080:8080 cbcap-runtime:test)
          trap 'docker stop "$container_id" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/healthz | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_id"
          exit 1
