name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm test

  cbcap-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CB-CAP production and test dependencies
        run: python -m pip install -e "python/cbcap_core[production,test]"
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Run typed contract and service tests
        run: pytest python/cbcap_core/tests
