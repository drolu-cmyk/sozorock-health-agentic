name: Deploy CB-CAP production runtime

on:
  push:
    branches: [main]
    paths:
      - "release/production.request"

permissions:
  contents: read
  id-token: write

concurrency:
  group: cbcap-agentic-production
  cancel-in-progress: false

jobs:
  activate:
    name: Build, migrate, prove, activate, rollback-test, and preflight
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    env:
      AWS_REGION: us-east-1
      EXPECTED_AWS_ACCOUNT_ID: '791860731989'
      DEPLOY_ROLE_ARN: arn:aws:iam::791860731989:role/cbcap-agentic-github-deploy
      CLOUDFORMATION_ROLE_ARN: arn:aws:iam::791860731989:role/cbcap-agentic-cloudformation
      AWS_PAGER: ""
    steps:
      - name: Check out exact approved main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Re-run exact-source release gates
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          npm test
          npm audit --omit=dev --audit-level=high
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
          approved_commit=$(git rev-parse HEAD)
          origin_main=$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')
          test "$origin_main" = "$approved_commit"
          echo "APPROVED_COMMIT=$approved_commit" >> "$GITHUB_ENV"

      - name: Assume repository-scoped AWS OIDC deployment role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          role-session-name: cbcap-agentic-production
          aws-region: ${{ env.AWS_REGION }}

      - name: Execute fail-closed production activation
        shell: bash
        run: bash scripts/deploy-production-runtime.sh

      - name: Upload nonsecret live proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cbcap-production-readiness-proof
          path: output/production/
          if-no-files-found: ignore
          retention-days: 30
