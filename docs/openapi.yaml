openapi: 3.1.0
info:
  title: SozoRock Health Agentic API
  version: 0.6.0
  description: |
    Non-clinical place intelligence and governed CB-CAP execution.
    CB-CAP resolves one county, consumes reviewed Evidence Gateway packages,
    and stops generated planning work for human review. It does not diagnose,
    determine funding, rank people, or replace county judgment.
  license:
    name: MIT
servers:
  - url: http://localhost:3000
    description: Local development
paths:
  /api/health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is available
          content:
            application/json:
              schema:
                type: object
                required: [status, service, version, runtime, time]
                properties:
                  status:
                    const: ok
                  service:
                    const: sozorock-health-agentic
                  version:
                    type: string
                  runtime:
                    const: governed-graph
                  time:
                    type: string
                    format: date-time
                  legacySessionsEnabled:
                    type: boolean
  /api/place:
    post:
      summary: Run the legacy place-intelligence entry point
      operationId: postPlace
      description: This endpoint remains during migration. Institutional CB-CAP planning uses /api/cbcap.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [location]
              properties:
                location:
                  type: string
                  maxLength: 120
                purpose:
                  type: string
                  enum: [resident, planner, funder, cbcap]
      responses:
        "200":
          description: Place-intelligence response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Invalid request
        "422":
          description: Unresolved or policy-blocked request
  /api/cbcap:
    post:
      summary: Run the governed CB-CAP county planning workflow
      operationId: postCbcap
      description: |
        Resolves the request to exactly one county FIPS before the planning engine
        may access evidence. Multi-county ZIP inputs and ambiguous county names stop
        for explicit selection. The planning engine uses the reviewed Evidence Gateway
        and produces a source-backed draft that requires human review. User assumptions
        may enter only explicitly marked scenario-capable workflows; the default runtime
        does not install a scenario or publish capability.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CbcapRequest"
      responses:
        "200":
          description: Approved output, only when an explicit reviewed publish capability is installed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CbcapRun"
        "202":
          description: Draft created and awaiting human review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CbcapRun"
        "400":
          description: Invalid request, assumptions, or approval record
        "409":
          description: Geography requires explicit county selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CbcapRun"
        "422":
          description: Governed runtime blocked the request
        "502":
          description: Governed evidence source unavailable
components:
  schemas:
    UserAssumption:
      type: object
      required: [source, value]
      additionalProperties: false
      properties:
        source:
          const: user
        value:
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: "null"
    ApprovalRecord:
      type: object
      required: [status, by, scope, reviewedAt]
      additionalProperties: true
      properties:
        status:
          const: approved
        by:
          type: string
          minLength: 1
        scope:
          const: county_plan
        reviewedAt:
          type: string
          format: date-time
    CbcapRequest:
      type: object
      required: [location]
      additionalProperties: false
      properties:
        location:
          type: string
          minLength: 1
          maxLength: 120
          description: County FIPS, supported ZIP input, or county name. Ambiguous or multi-county inputs require explicit county selection.
        assumptions:
          type: object
          minProperties: 1
          maxProperties: 20
          additionalProperties:
            $ref: "#/components/schemas/UserAssumption"
        approval:
          $ref: "#/components/schemas/ApprovalRecord"
    PlaceResolution:
      type: object
      additionalProperties: true
      properties:
        status:
          type: string
          enum: [resolved, ambiguous, unresolved]
        countyFips:
          type: string
          pattern: "^[0-9]{5}$"
        county:
          type: string
        state:
          type: string
        input:
          type: string
        matches:
          type: array
          items:
            type: object
            additionalProperties: true
    CbcapRun:
      type: object
      additionalProperties: true
      properties:
        type:
          const: cbcap_county_plan
        runId:
          type: string
        status:
          type: string
          enum: [awaiting_human_review, approved_output, needs_place_selection, evidence_unavailable, blocked, error]
        placeResolution:
          $ref: "#/components/schemas/PlaceResolution"
        evidence:
          type: object
          description: Governed Evidence Gateway package and release identity retained for audit.
          additionalProperties: true
        barriers:
          type: object
          description: Reviewed pathway barriers and accessibility context. No composite score or automatic priority ranking is produced.
          additionalProperties: true
        planning:
          type: object
          description: Draft evidence organization. Funding allocation, county priorities, and official CHA/CHIP decisions remain human authority.
          additionalProperties: true
        scenario:
          type: object
          description: Present only when a reviewed scenario capability is installed and explicit user assumptions authorize it.
          additionalProperties: true
        draft:
          type: object
          description: Draft for human review.
          additionalProperties: true
        approval:
          type: object
          additionalProperties: true
        output:
          type: object
          description: Approved output only when an explicit reviewed publish capability is installed.
          additionalProperties: true
