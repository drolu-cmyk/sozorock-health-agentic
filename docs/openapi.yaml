openapi: 3.1.0
info:
  title: SozoRock Health Agentic API
  version: 0.9.0
  description: |
    Non-clinical place intelligence and identity-gated CB-CAP execution.
    Institutional CB-CAP uses authenticated workspace identity, authoritative
    tenant assignment, governed Evidence Gateway packages, resumable run state,
    human review, and feature-gated funding evidence matching. It does not
    diagnose, determine final funding eligibility, predict awards, allocate
    funding, rank people, or replace county or funder judgment.

    Institutional endpoints fail closed unless an authenticated gateway is
    configured. The unauthenticated CB-CAP mode is an explicit local development
    override and is not part of this production API contract.
  license:
    name: MIT
servers:
  - url: http://localhost:3000
    description: Local development
paths:
  /api/health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is available
          content:
            application/json:
              schema:
                type: object
                required: [status, service, version, runtime, time]
                properties:
                  status:
                    const: ok
                  service:
                    const: sozorock-health-agentic
                  version:
                    type: string
                  runtime:
                    const: governed-graph
                  time:
                    type: string
                    format: date-time
                  institutionalAccessEnabled:
                    type: boolean
                  reviewContinuationEnabled:
                    type: boolean
                  fundingIntelligenceRouteEnabled:
                    type: boolean
                  unauthenticatedDevCBCAPEnabled:
                    type: boolean
                  legacySessionsEnabled:
                    type: boolean
  /api/place:
    post:
      summary: Run the legacy place-intelligence entry point
      operationId: postPlace
      description: This endpoint remains during migration. Institutional CB-CAP planning uses the authenticated /api/cbcap route.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [location]
              properties:
                location:
                  type: string
                  maxLength: 120
                purpose:
                  type: string
                  enum: [resident, planner, funder, cbcap]
      responses:
        "200":
          description: Place-intelligence response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Invalid request
        "422":
          description: Unresolved or policy-blocked request
  /api/cbcap:
    post:
      summary: Start an authenticated CB-CAP county planning run
      operationId: postCbcap
      security:
        - bearerAuth: []
      description: |
        Resolves the authenticated workspace actor and tenant before selecting a
        tenant-scoped runtime. The request is then resolved to exactly one county
        FIPS before evidence access. Multi-county ZIP inputs and ambiguous county
        names stop for explicit selection. The planning engine uses the reviewed
        Evidence Gateway, checkpoints the run, and produces a source-backed draft
        that requires human review.

        Foundation reviewers, county planners, and community partners with owner
        or contributor access may start planning work. Viewers and agent actors
        cannot start institutional plans.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CbcapRequest"
      responses:
        "202":
          description: Draft created and awaiting human review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CbcapRun"
        "400":
          description: Invalid request or assumptions
        "403":
          description: Authentication or workspace authorization failed
        "409":
          description: Geography requires explicit county selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CbcapRun"
        "422":
          description: Governed runtime blocked the request
        "502":
          description: Governed evidence source unavailable
        "503":
          description: Tenant runtime is not configured
  /api/cbcap/runs/{runId}/review:
    post:
      summary: Continue an authenticated saved CB-CAP review run
      operationId: reviewCbcapRun
      security:
        - bearerAuth: []
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      description: |
        Continues the exact saved review checkpoint. Only foundation reviewers
        and county planners with owner or contributor access may approve. The
        client supplies only the decision. Reviewer identity and tenant come from
        the authenticated workspace session; run identity and Evidence Gateway
        release identity come from the saved checkpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision:
                  const: approve
      responses:
        "200":
          description: Saved run continued to approved output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CbcapRun"
        "400":
          description: Invalid review request
        "403":
          description: Authentication, role, access, or tenant authorization failed
        "404":
          description: Saved run not found in the authenticated tenant
        "409":
          description: Run is not resumable or continuation failed
        "422":
          description: Continued run did not reach approved output
        "503":
          description: Tenant review runtime is not configured
  /api/cbcap/funding/evaluate:
    post:
      summary: Evaluate reviewed funding requirements against governed institutional evidence
      operationId: evaluateCbcapFundingFit
      security:
        - bearerAuth: []
      description: |
        Performs read-only evidence matching for one governed funding opportunity.
        The client supplies only the opportunity ID, county context, optional state
        context, and optional as-of date. Opportunity criteria and the institutional
        applicant profile are loaded from server-side governed providers.

        The result never determines final eligibility, predicts an award, allocates
        funding, or recommends a funding decision. It reports requirement matching,
        evidence fit, missing evidence, missing partners, source lineage, deadline
        state, and caveats for human review.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FundingEvaluationRequest"
      responses:
        "200":
          description: Provisional evidence-matching result or closed-opportunity state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundingFitResult"
        "400":
          description: Invalid request. Client-supplied opportunity criteria or applicant profiles are rejected.
        "403":
          description: Authentication, workspace authorization, or tenant profile authorization failed
        "404":
          description: Reviewed opportunity was not found
        "422":
          description: Funding reasoning was blocked by an unverified source, missing criterion lineage, or invalid governed record
        "503":
          description: Governed funding opportunity or tenant profile provider is not configured or unavailable
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Cognito access token
  schemas:
    UserAssumption:
      type: object
      required: [source, value]
      additionalProperties: false
      properties:
        source:
          const: user
        value:
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: "null"
    CbcapRequest:
      type: object
      required: [location]
      additionalProperties: false
      properties:
        location:
          type: string
          minLength: 1
          maxLength: 120
          description: County FIPS, supported ZIP input, or county name. Ambiguous or multi-county inputs require explicit county selection.
        assumptions:
          type: object
          minProperties: 1
          maxProperties: 20
          additionalProperties:
            $ref: "#/components/schemas/UserAssumption"
    PlaceResolution:
      type: object
      additionalProperties: true
      properties:
        status:
          type: string
          enum: [resolved, ambiguous, unresolved]
        countyFips:
          type: string
          pattern: "^[0-9]{5}$"
        county:
          type: string
        state:
          type: string
        input:
          type: string
        matches:
          type: array
          items:
            type: object
            additionalProperties: true
    CbcapRun:
      type: object
      additionalProperties: true
      properties:
        type:
          const: cbcap_county_plan
        runId:
          type: string
        tenantId:
          type: string
        status:
          type: string
          enum: [awaiting_human_review, approved_output, needs_place_selection, evidence_unavailable, blocked, error]
        placeResolution:
          $ref: "#/components/schemas/PlaceResolution"
        evidence:
          type: object
          description: Governed Evidence Gateway package and release identity retained for audit and exact-run continuation.
          additionalProperties: true
        barriers:
          type: object
          description: Reviewed pathway barriers and accessibility context. No composite score or automatic priority ranking is produced.
          additionalProperties: true
        planning:
          type: object
          description: Draft evidence organization including the governed CHA/CHIP workbench. Funding allocation, county priorities, and official CHA/CHIP decisions remain human authority.
          additionalProperties: true
        scenario:
          type: object
          description: Present only when a reviewed scenario capability is installed and explicit user assumptions authorize it.
          additionalProperties: true
        draft:
          type: object
          description: Draft for human review.
          additionalProperties: true
        output:
          type: object
          description: Approved output generated only through exact-run authenticated review continuation.
          additionalProperties: true
    FundingEvaluationRequest:
      type: object
      additionalProperties: false
      required: [opportunityId, countyId]
      properties:
        opportunityId:
          type: string
          minLength: 1
          maxLength: 240
        countyId:
          type: string
          minLength: 1
          maxLength: 240
        stateId:
          type: string
          minLength: 1
          maxLength: 240
        asOf:
          type: string
          format: date
    FundingCriterionResult:
      type: object
      additionalProperties: true
      properties:
        criterionId:
          type: string
        type:
          type: string
          enum: [applicant_type, geography, designation, partner, evidence, plan_priority, barrier]
        status:
          type: string
          enum: [matched, incomplete, conflict, not_applicable]
        explanation:
          type: string
    FundingFitResult:
      type: object
      additionalProperties: true
      required: [kind, opportunityId, status, deadlineStatus, requirementsStatus, fitStatus, humanReviewRequired, finalEligibilityAuthority, awardPredictionProduced, fundingAllocationProduced]
      properties:
        kind:
          const: cbcap_funding_fit_v1
        opportunityId:
          type: string
        opportunityTitle:
          type: string
        status:
          type: string
          enum: [provisional_review_required, blocked, closed_opportunity]
        deadlineStatus:
          type: string
          enum: [open, closed, not_yet_open, unknown]
        requirementsStatus:
          type: string
          enum: [matched, incomplete, conflict, unknown]
        fitStatus:
          type: string
          enum: [strong_evidence_fit, partial_evidence_fit, weak_evidence_fit, not_evaluated]
        criteria:
          type: array
          items:
            $ref: "#/components/schemas/FundingCriterionResult"
        missingEvidenceIds:
          type: array
          items:
            type: string
        missingPartnerIds:
          type: array
          items:
            type: string
        humanReviewRequired:
          const: true
        finalEligibilityAuthority:
          const: funder_and_authorized_humans
        awardPredictionProduced:
          const: false
        fundingAllocationProduced:
          const: false
