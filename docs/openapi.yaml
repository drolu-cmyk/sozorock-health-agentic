openapi: 3.1.0
info:
  title: SozoRock Health Agentic API
  version: 0.6.0
  description: |
    Non-clinical place intelligence and governed CB-CAP execution.
    CB-CAP consumes the reviewed Evidence Gateway, does not create clinical decisions,
    and requires explicit human approval before an output can become approved.
  license:
    name: MIT
servers:
  - url: http://localhost:3000
    description: Local development
paths:
  /api/health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is available
          content:
            application/json:
              schema:
                type: object
                required: [status, service, version, runtime, time]
                properties:
                  status:
                    const: ok
                  service:
                    const: sozorock-health-agentic
                  version:
                    type: string
                  runtime:
                    const: governed-graph
                  time:
                    type: string
                    format: date-time
  /api/place:
    post:
      summary: Run the legacy place-intelligence entry point
      operationId: postPlace
      description: |
        This endpoint remains during migration. CB-CAP institutional decisions use /api/cbcap.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [location]
              properties:
                location:
                  type: string
                  maxLength: 120
                purpose:
                  type: string
                  enum: [resident, planner, funder, cbcap]
      responses:
        "200":
          description: Place-intelligence response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Invalid request
        "422":
          description: Unresolved or policy-blocked request
  /api/cbcap:
    post:
      summary: Run the governed CB-CAP county planning graph
      operationId: postCbcap
      description: |
        Resolves exactly one county, loads a reviewed Evidence Gateway package, organizes
        source-backed barrier evidence and planning questions, optionally performs arithmetic
        using explicit user assumptions, drafts an evidence brief, and stops for human review.
        Supplying a complete human approval record permits an approved output. It does not
        execute an external publication side effect.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CbcapRequest"
      responses:
        "200":
          description: Human-approved CB-CAP output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CbcapRun"
        "202":
          description: Draft created and awaiting human review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CbcapRun"
        "400":
          description: Invalid request, assumptions, or approval record
        "409":
          description: Geography requires explicit county selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CbcapRun"
        "422":
          description: Governed runtime blocked the request
        "502":
          description: Governed evidence source unavailable
components:
  schemas:
    UserAssumption:
      type: object
      required: [source, value]
      additionalProperties: false
      properties:
        source:
          const: user
        value:
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: "null"
    ApprovalRecord:
      type: object
      required: [status, by, scope, reviewedAt]
      additionalProperties: true
      properties:
        status:
          const: approved
        by:
          type: string
          minLength: 1
        scope:
          const: county_plan
        reviewedAt:
          type: string
          format: date-time
    CbcapRequest:
      type: object
      required: [location]
      additionalProperties: false
      properties:
        location:
          type: string
          minLength: 1
          maxLength: 120
          description: County FIPS, supported ZIP input, or exact county name. Multi-county ZIP inputs require explicit county selection.
        assumptions:
          type: object
          minProperties: 1
          maxProperties: 20
          additionalProperties:
            $ref: "#/components/schemas/UserAssumption"
        approval:
          $ref: "#/components/schemas/ApprovalRecord"
    PlaceSelection:
      type: object
      additionalProperties: true
      properties:
        status:
          type: string
          enum: [resolved, ambiguous, unresolved]
        countyFips:
          type: string
          pattern: "^[0-9]{5}$"
        name:
          type: string
        matches:
          type: array
          items:
            type: object
            additionalProperties: true
    EvidenceRelease:
      type: object
      required: [contract, releaseId, releaseHash]
      properties:
        contract:
          const: sozorock.evidence-gateway.v1
        releaseId:
          type: string
        releaseHash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
    CbcapRun:
      type: object
      required: [runId, status]
      additionalProperties: true
      properties:
        runId:
          type: string
        status:
          type: string
          enum:
            - awaiting_human_review
            - needs_place_selection
            - approved_output
            - evidence_unavailable
            - blocked
        place:
          $ref: "#/components/schemas/PlaceSelection"
        evidence:
          type: object
          additionalProperties: true
        barriers:
          type: object
          description: Source-backed barrier measures only. No composite score or priority rank is produced.
          additionalProperties: true
        planning:
          type: object
          description: Derived planning questions and evidence gaps. County priority and response recommendations remain unestablished until local review.
          additionalProperties: true
        scenario:
          type: object
          description: Arithmetic planning output based only on explicit user assumptions. Not a forecast or impact claim.
          additionalProperties: true
        draft:
          type: object
          description: Draft for human review.
          additionalProperties: true
        approval:
          type: object
          additionalProperties: true
        output:
          type: object
          description: Human-approved output. externalPublicationExecuted remains false in this runtime.
          additionalProperties: true
