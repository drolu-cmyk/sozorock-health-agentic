openapi: 3.1.0
info:
  title: SozoRock Health Agentic API
  version: 0.7.0
  description: |
    Non-clinical place intelligence and governed CB-CAP execution.
    CB-CAP resolves one county, consumes reviewed Evidence Gateway packages,
    checkpoints the resulting graph state, and stops generated planning work
    for human review. It does not diagnose, determine funding, rank people,
    or replace county judgment.

    Version 0.7 introduces resumable run-state contracts. The authenticated
    review-continuation route remains disabled and is not part of this public
    contract unless an authorized review service and tenant-scoped durable
    persistence are explicitly installed.
  license:
    name: MIT
servers:
  - url: http://localhost:3000
    description: Local development
paths:
  /api/health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is available
          content:
            application/json:
              schema:
                type: object
                required: [status, service, version, runtime, time]
                properties:
                  status:
                    const: ok
                  service:
                    const: sozorock-health-agentic
                  version:
                    type: string
                  runtime:
                    const: governed-graph
                  time:
                    type: string
                    format: date-time
                  legacySessionsEnabled:
                    type: boolean
                  reviewContinuationEnabled:
                    type: boolean
  /api/place:
    post:
      summary: Run the legacy place-intelligence entry point
      operationId: postPlace
      description: This endpoint remains during migration. Institutional CB-CAP planning uses /api/cbcap.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [location]
              properties:
                location:
                  type: string
                  maxLength: 120
                purpose:
                  type: string
                  enum: [resident, planner, funder, cbcap]
      responses:
        "200":
          description: Place-intelligence response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Invalid request
        "422":
          description: Unresolved or policy-blocked request
  /api/cbcap:
    post:
      summary: Start a governed CB-CAP county planning run
      operationId: postCbcap
      description: |
        Resolves the request to exactly one county FIPS before the planning engine
        may access evidence. Multi-county ZIP inputs and ambiguous county names stop
        for explicit selection. The planning engine uses the reviewed Evidence Gateway,
        checkpoints the run, and produces a source-backed draft that requires human review.

        Approval is intentionally not accepted on this initial request. Approval may
        later continue the exact saved run and exact Evidence Gateway release only when
        an authenticated tenant-scoped review service is explicitly installed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CbcapRequest"
      responses:
        "202":
          description: Draft created and awaiting human review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CbcapRun"
        "400":
          description: Invalid request or assumptions, including approval submitted on the initial request
        "409":
          description: Geography requires explicit county selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CbcapRun"
        "422":
          description: Governed runtime blocked the request
        "502":
          description: Governed evidence source unavailable
components:
  schemas:
    UserAssumption:
      type: object
      required: [source, value]
      additionalProperties: false
      properties:
        source:
          const: user
        value:
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: "null"
    CbcapRequest:
      type: object
      required: [location]
      additionalProperties: false
      properties:
        location:
          type: string
          minLength: 1
          maxLength: 120
          description: County FIPS, supported ZIP input, or county name. Ambiguous or multi-county inputs require explicit county selection.
        assumptions:
          type: object
          minProperties: 1
          maxProperties: 20
          additionalProperties:
            $ref: "#/components/schemas/UserAssumption"
    PlaceResolution:
      type: object
      additionalProperties: true
      properties:
        status:
          type: string
          enum: [resolved, ambiguous, unresolved]
        countyFips:
          type: string
          pattern: "^[0-9]{5}$"
        county:
          type: string
        state:
          type: string
        input:
          type: string
        matches:
          type: array
          items:
            type: object
            additionalProperties: true
    CbcapRun:
      type: object
      additionalProperties: true
      properties:
        type:
          const: cbcap_county_plan
        runId:
          type: string
        status:
          type: string
          enum: [awaiting_human_review, needs_place_selection, evidence_unavailable, blocked, error]
        placeResolution:
          $ref: "#/components/schemas/PlaceResolution"
        evidence:
          type: object
          description: Governed Evidence Gateway package and release identity retained for audit and exact-run continuation.
          additionalProperties: true
        barriers:
          type: object
          description: Reviewed pathway barriers and accessibility context. No composite score or automatic priority ranking is produced.
          additionalProperties: true
        planning:
          type: object
          description: Draft evidence organization. Funding allocation, county priorities, and official CHA/CHIP decisions remain human authority.
          additionalProperties: true
        scenario:
          type: object
          description: Present only when a reviewed scenario capability is installed and explicit user assumptions authorize it.
          additionalProperties: true
        draft:
          type: object
          description: Draft for human review.
          additionalProperties: true
