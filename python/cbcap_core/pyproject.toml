[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cbcap-core"
version = "0.1.0"
description = "Typed state and public evidence contracts for the CB-CAP planning graph"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cbcap_core"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
