[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cbcap-core"
version = "0.3.0"
description = "Typed state, shared evidence contracts, and durable graph runtime for CB-CAP"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.2,<2",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
production = [
  "fastapi>=0.141.1,<0.142",
  "langgraph-checkpoint-postgres==3.1.2",
  "psycopg[binary,pool]>=3.2,<4",
  "pycryptodome>=3.23,<4",
  "PyJWT[crypto]>=2.10.1,<3",
  "uvicorn[standard]>=0.52.3,<0.53",
]
test = [
  "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cbcap_core"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
