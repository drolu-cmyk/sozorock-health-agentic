[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cbcap-core"
version = "0.2.0"
description = "Typed state, shared evidence contracts, and durable graph runtime for CB-CAP"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.2,<2",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cbcap_core"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
